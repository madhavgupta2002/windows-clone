    let history = [{ type: 'home' }];
    let index = 0;

    function navigate(route, record = true) {
      if (record) {
        history = history.slice(0, index + 1);
        history.push(route);
        index++;
      }
      render(route);
    }

    function search(value) {
      const query = value.trim();
      if (!query || /^web:\/\/home\/?$/i.test(query)) {
        navigate({ type: 'home' });
        return;
      }
      if (/^web:\/\//i.test(query)) {
        const id = query.replace(/^web:\/\//i, '').replace(/\/$/, '').toLowerCase();
        if (knowledge.some(article => article.id === id)) {
          navigate({ type: 'article', id });
          return;
        }
      }
      navigate({ type: 'search', query });
    }

    function render(route) {
      $('[data-nav="back"]', state.body).disabled = index === 0;
      $('[data-nav="forward"]', state.body).disabled = index === history.length - 1;
      page.replaceChildren();
      if (route.type === 'home') {
        address.value = 'web://home';
        state.setTitle('Welcome - Internet Explorer');
        page.innerHTML = `
          <div class="browser-brand">${icon('browser')} Discover</div>
          <div class="browser-subtitle">Your little corner of the offline internet.</div>
          <form class="browser-search">
            <input aria-label="Search the offline library" placeholder="Search Windows, files, shortcuts…" autocomplete="off">
            <button class="standard-button">Search</button>
          </form>
          <div class="browser-notice">
            <strong>Built for offline exploration.</strong><br>
            Search the included knowledge library. External websites are not loaded in this simulation.
          </div>
          <h2 style="font-size:16px;font-weight:400;margin-top:27px">Explore the desktop</h2>`;
        const form = $('.browser-search', page);
        form.addEventListener('submit', event => {
          event.preventDefault();
          search($('input', form).value);
        });
        knowledge.slice(1, 4).forEach(article => addResult(article));
      } else if (route.type === 'article') {
        const article = knowledge.find(item => item.id === route.id) || knowledge[0];
        address.value = `web://${article.id}`;
        state.setTitle(`${article.title} - Internet Explorer`);
        page.innerHTML = `
          <div class="result-url">web://${escapeHTML(article.id)}</div>
          <h1>${escapeHTML(article.title)}</h1>
          <div class="article-body">${escapeHTML(article.body)}</div>`;
      } else {
        address.value = route.query;
        state.setTitle(`${route.query} - Internet Explorer`);
        const terms = route.query.toLowerCase().split(/\s+/).filter(Boolean);
        const ranked = knowledge.map(article => {
          const haystack = `${article.title} ${article.keywords} ${article.summary} ${article.body}`.toLowerCase();
          return { article, score: terms.reduce((score, term) => score + (haystack.includes(term) ? 1 : 0), 0) };
        }).filter(result => result.score > 0).sort((a, b) => b.score - a.score);
        page.innerHTML = `
          <h1 style="font-size:22px;margin-top:0">Search: ${escapeHTML(route.query)}</h1>
          <p style="color:#718492">${ranked.length} local result${ranked.length === 1 ? '' : 's'}</p>`;
        if (!ranked.length) {
          page.innerHTML += `
            <div class="browser-notice">No matching local articles. Try “Windows”, “Notepad”,
            “Calculator”, “files”, “shortcuts”, or “privacy”.<br>
            This offline browser does not access public websites.</div>`;
        }
        ranked.forEach(result => addResult(result.article));
      }
      page.scrollTop = 0;
    }

    function addResult(article) {
      const result = document.createElement('article');
      result.className = 'search-result';
      result.innerHTML = `
        <button class="result-title">${escapeHTML(article.title)}</button>
        <div class="result-url">web://${escapeHTML(article.id)}</div>
        <p>${escapeHTML(article.summary)}</p>`;
      $('button', result).addEventListener('click', () => navigate({ type: 'article', id: article.id }));
      page.append(result);
    }

    $('.browser-toolbar form', state.body).addEventListener('submit', event => {
      event.preventDefault();
      search(address.value);
    });
    address.addEventListener('focus', () => address.select());
    $('[data-nav="back"]', state.body).addEventListener('click', () => {
      if (index > 0) navigate(history[--index], false);
    });
    $('[data-nav="forward"]', state.body).addEventListener('click', () => {
      if (index < history.length - 1) navigate(history[++index], false);
    });
    $('[data-nav="home"]', state.body).addEventListener('click', () => navigate({ type: 'home' }));
    render(history[0]);
    return state;
  }

  /* ---------- Personalization ---------- */
  function applyTheme(theme) {
    prefs.theme = theme;
    document.body.dataset.theme = theme;
    savePrefs();
    document.dispatchEvent(new CustomEvent('preferenceschange'));
  }

  function createPersonalization() {
    const state = WindowManager.create({
      title: 'Personalization', icon: 'settings', width: 650, height: 515, app: 'personalize'
    });

    function render() {
      state.body.innerHTML = `
        <div class="explorer-toolbar">
          ${icon('settings')}
          <div class="address-path">Control Panel &nbsp; › &nbsp; Appearance and Personalization</div>
        </div>
        <div class="settings-page">
          <h1>Change the visuals and sounds on your computer</h1>
          <p>Choose a theme to change the desktop background and Aero window color.</p>
          <div class="theme-grid">
            ${Object.entries(themes).map(([id, theme]) => `
              <button class="theme-card ${prefs.theme === id ? 'active' : ''}"
                data-theme-choice="${id}" aria-pressed="${prefs.theme === id}">
                <div class="theme-preview" style="background:linear-gradient(135deg,${theme.colors})">
                  ${icon('windows')}
                </div>
                ${escapeHTML(theme.name)}
              </button>`).join('')}
          </div>
          <div class="settings-row">
            <label for="${state.id}-icon-size">Desktop icon size</label>
            <select id="${state.id}-icon-size">
              ${['large', 'medium', 'small'].map(size =>
                `<option value="${size}" ${prefs.size === size ? 'selected' : ''}>${size[0].toUpperCase() + size.slice(1)} icons</option>`
              ).join('')}
            </select>
          </div>
          <div class="settings-row">
            <span>Desktop icon arrangement</span>
            <button class="standard-button" data-arrange>Sort by name</button>
          </div>
          <p style="font-size:11px">Wallpaper is rendered locally as vector artwork.
          Preferences are saved in this browser when local storage is available.</p>
        </div>`;
      $$('[data-theme-choice]', state.body).forEach(button =>
        button.addEventListener('click', () => applyTheme(button.dataset.themeChoice)));
      $('select', state.body).addEventListener('change', event => {
        Desktop.setSize(event.target.value);
        document.dispatchEvent(new CustomEvent('preferenceschange'));
      });
      $('[data-arrange]', state.body).addEventListener('click', () => {
        Desktop.sort('name');
        toast('Desktop icons sorted by name.');
      });
    }
    document.addEventListener('preferenceschange', render);
    state.onCleanup(() => document.removeEventListener('preferenceschange', render));
    render();
    return state;
  }

  /* ---------- App registry and Start menu ---------- */
  const programs = [
    { id: 'notepad', name: 'Notepad', icon: 'notepad', keywords: 'text editor document write', pinned: true },
    { id: 'calculator', name: 'Calculator', icon: 'calculator', keywords: 'math numbers arithmetic', pinned: true },
    { id: 'browser', name: 'Internet Explorer', icon: 'browser', keywords: 'internet browser search web', pinned: true },
    { id: 'explorer', name: 'Windows Explorer', icon: 'folder', keywords: 'files folders computer', pinned: true },
    { id: 'personalize', name: 'Personalization', icon: 'settings', keywords: 'control panel settings wallpaper theme', pinned: false },
    { id: 'help', name: 'Help and Support', icon: 'computer', keywords: 'help support guide shortcuts', pinned: false }
  ];

  const appFactories = {
    explorer: createExplorer,
    notepad: createNotepad,
    calculator: createCalculator,
    browser: createBrowser,
    personalize: createPersonalization,
    help: () => createNotepad({ text: welcomeText, title: 'Windows Help' })
  };

  function launch(id, options = {}) {
    hidePopups();
    const factory = appFactories[id];
    return factory ? factory(options) : null;
  }

  let allPrograms = false;

  function setStartOpen(open) {
    const menu = $('#start-menu');
    if (open) {
      $('#context-menu').hidden = true;
      $('#calendar').hidden = true;
    }
    menu.hidden = !open;
    $('#start-button').classList.toggle('open', open);
    $('#start-button').setAttribute('aria-expanded', String(open));
    if (open) {
      allPrograms = false;
      $('#start-search').value = '';
      renderStartPrograms();
      $('#start-search').focus();
    }
  }

  function renderStartPrograms() {
    const container = $('#start-programs');
    const query = $('#start-search').value.trim().toLowerCase();
    const matches = programs.filter(program => {
      if (query) return `${program.name} ${program.keywords}`.toLowerCase().includes(query);
      return allPrograms || program.pinned;
    });
    container.replaceChildren();

    function addProgram(name, iconName, action) {
      const button = document.createElement('button');
      button.className = 'program-button';
      button.innerHTML = `${icon(iconName)}<span>${escapeHTML(name)}</span>`;
      button.addEventListener('click', action);
      container.append(button);
    }

    matches.forEach(program => addProgram(program.name, program.icon, () => launch(program.id)));
    if (query) {
      const matchingFiles = files.filter(file =>
        file.type === 'text' && file.parent !== 'recycle' && file.name.toLowerCase().includes(query)
      ).slice(0, 12);
      if (matchingFiles.length) {
        const heading = document.createElement('div');
        heading.className = 'sidebar-heading';
        heading.textContent = 'Files';
        container.append(heading);
        matchingFiles.forEach(file => addProgram(file.name, 'text', () => {
          hidePopups();
          openFile(file.id);
        }));
      }
    }
    if (!container.children.length) container.innerHTML = '<div class="start-empty">No matching programs or files.</div>';
    $('#all-programs').textContent = allPrograms ? '◂   Back' : '▸   All Programs';
  }

  $('#start-button').addEventListener('click', () => setStartOpen($('#start-menu').hidden));
  $('#all-programs').addEventListener('click', () => {
    allPrograms = !allPrograms;
    $('#start-search').value = '';
    renderStartPrograms();
  });
  $('#start-search').addEventListener('input', renderStartPrograms);
  $('#start-search').addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      $('.program-button', $('#start-programs'))?.click();
    }
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      $('.program-button', $('#start-programs'))?.focus();
    }
  });
  $$('[data-location]', $('#start-menu')).forEach(button =>
    button.addEventListener('click', () => launch('explorer', { location: button.dataset.location })));
  $$('[data-launch]', $('#start-menu')).forEach(button =>
    button.addEventListener('click', () => launch(button.dataset.launch)));

  /* ---------- Clock and calendar ---------- */
  function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const date = now.toLocaleDateString([], { month: 'numeric', day: 'numeric', year: 'numeric' });
    $('#clock').innerHTML = `${escapeHTML(time)}<br>${escapeHTML(date)}`;
    $('#clock').title = now.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    $('#clock').setAttribute('aria-label', `${time}, ${$('#clock').title}`);
    if (!$('#calendar').hidden) renderCalendar();
  }

  function renderCalendar() {
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
    const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    let cells = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa']
      .map(day => `<span class="day-name">${day}</span>`).join('');
    cells += '<span></span>'.repeat(first);
    for (let day = 1; day <= days; day++) {
      cells += `<span class="${day === now.getDate() ? 'today' : ''}">${day}</span>`;
    }
    $('#calendar').innerHTML = `
      <h2>${escapeHTML(now.toLocaleDateString([], { month: 'long', year: 'numeric' }))}</h2>
      <div class="calendar-grid">${cells}</div>
      <div class="calendar-footer">${escapeHTML(now.toLocaleTimeString())}<br>Local system time</div>`;
  }

  $('#clock').addEventListener('click', () => {
    const open = $('#calendar').hidden;
    hidePopups();
    if (open) {
      renderCalendar();
      $('#calendar').hidden = false;
    }
  });
  $('#show-desktop').addEventListener('click', () => {
    hidePopups();
    WindowManager.showDesktop();
  });

  /* ---------- Shutdown and global interaction ---------- */
  $('#shutdown').addEventListener('click', () => {
    const dirtyWindows = [...WindowManager.windows.values()].filter(state => state.dirty);
    if (dirtyWindows.length && !confirm(
      `${dirtyWindows.length} document(s) have unsaved changes. Shut down and discard those changes?`
    )) return;

    hidePopups();
    savePrefs();
    [...WindowManager.windows.keys()].forEach(id => WindowManager.close(id, true));
    WindowManager.desktopSnapshot = null;
    $('#power-screen').hidden = false;
    $('#restart').focus();
  });

  $('#restart').addEventListener('click', () => {
    $('#power-screen').hidden = true;
    Desktop.element.focus();
    toast('Welcome back.');
  });

  document.addEventListener('pointerdown', event => {
    if (!event.target.closest('#context-menu')) $('#context-menu').hidden = true;
    if (!event.target.closest('#start-menu, #start-button')) setStartOpen(false);
    if (!event.target.closest('#calendar, #clock')) $('#calendar').hidden = true;
  });

  document.addEventListener('keydown', event => {
    if (!$('#power-screen').hidden) return;
    const target = event.target;
    const editing = target instanceof Element && target.matches('input, textarea, select, [contenteditable="true"]');

    if (event.ctrlKey && event.key === 'Escape') {
      event.preventDefault();
      setStartOpen($('#start-menu').hidden);
      return;
    }
    if (event.key === 'Escape') {
      hidePopups();
      return;
    }
    if (event.altKey && event.key === 'F4' && WindowManager.active) {
      event.preventDefault();
      WindowManager.close(WindowManager.active);
      return;
    }
    if (event.key === 'F5') {
      event.preventDefault();
      Desktop.refresh();
      return;
    }

    const desktopFocused = Desktop.element.contains(document.activeElement) ||
      document.activeElement === document.body;
    if (!editing && desktopFocused) {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'a') {
        event.preventDefault();
        Desktop.selected = new Set(children('desktop').map(file => file.id));
        Desktop.paintSelection();
      } else if (event.key === 'Delete') {
        event.preventDefault();
        Desktop.deleteSelected();
      } else if (event.key === 'F2' && Desktop.selected.size === 1) {
        event.preventDefault();
        Desktop.rename([...Desktop.selected][0]);
      } else if (event.key === 'Enter' && target === Desktop.element) {
        event.preventDefault();
        [...Desktop.selected].forEach(openFile);
      }
    }
  });

  window.addEventListener('beforeunload', event => {
    savePrefs();
    if ([...WindowManager.windows.values()].some(state => state.dirty)) {
      event.preventDefault();
      event.returnValue = '';
    }
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      WindowManager.windows.forEach(state => {
        WindowManager.constrain(state);
        WindowManager.layout(state);
      });
      Desktop.render();
      hidePopups();
    }, 80);
  });

  /* ---------- Boot ---------- */
  document.body.dataset.theme = prefs.theme;
  Desktop.init();
  renderStartPrograms();
  updateClock();
  setInterval(updateClock, 1000);
  Desktop.element.focus();
})();
</script>
</body>
</html>
